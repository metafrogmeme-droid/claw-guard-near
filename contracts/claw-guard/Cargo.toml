# Claw Guard policy contract. Testnet only. Not audited.
[package]
name = "claw-guard"
description = "Claw Guard: Signing Gate for AI Agents (NEAR testnet prototype)"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
# NEP-0330: cargo-near exposes this link through the `contract_source_metadata` view.
repository = "https://github.com/metafrogmeme-droid/claw-guard-near"

[lib]
crate-type = ["cdylib", "rlib"]

# NEP-0330 reproducible build settings (Q-30): cargo-near 0.22.0 with Rust 1.97.1, matching
# rust-toolchain.toml (D-02). Tag pushed to Docker Hub on 17 Jul 2026; digest read from Docker
# Hub on 1 Nov 2026. CI job `reproducible` builds with it.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

# `cargo near build reproducible-wasm --variant mainnet`: the same image with the `mainnet`
# feature (docs/MAINNET.md).
[package.metadata.near.reproducible_build.variant.mainnet]
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--features",
    "mainnet",
]

[features]
# Off by default. Lets `new` accept the NEAR mainnet pair (a `.near` contract with MPC
# `v1.signer`); see docs/MAINNET.md. Signing targets stay Hyperliquid testnet and Base Sepolia.
mainnet = []

[dependencies]
# near-sdk 5.29.1 with near-sdk-env 0.1.6 (near-sys 0.2.14): the newest release whose wasm
# imports only host functions NEAR mainnet protocol 86 has (owner decision D-21, docs/MAINNET.md).
# near-sdk-env 0.1.8 / near-sys 0.4 add protocol-88 imports that mainnet refuses at link time.
near-sdk = "=5.29.1"
near-sdk-env = "=0.1.6"
# The same serde_json near-sdk already uses, plus `raw_value`: `MarketRule.sz_decimals` is read
# from its raw JSON text, so that any value (even `1e400`) is ERR_INVALID_RULES (owner decision
# D-11), never a JSON parse error.
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
serde_json = "1"
# Dev-only: checks that the reference signatures in the test vectors recover to the vector
# signer from the digests this crate computes. Never part of the contract wasm.
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }

# near-sdk >= 5.27 builds contracts with `--cfg near`.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
