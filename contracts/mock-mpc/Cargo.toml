# SANDBOX ONLY: stand-in for the NEAR chain-signatures MPC contract
# (v1.signer-prod.testnet) in near-workspaces tests and the offline demo.
# Sandbox test key, worthless, never use anywhere else. Not audited.
[package]
name = "mock-mpc"
description = "Claw Guard sandbox-only mock of the NEAR MPC sign contract (test key, worthless)"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
# NEP-0330: cargo-near exposes this link through the `contract_source_metadata` view.
repository = "https://github.com/metafrogmeme-droid/claw-guard-near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# near-sdk 5.29.1 with near-sdk-env 0.1.6 (near-sys 0.2.14): the newest release whose wasm
# imports only host functions NEAR mainnet protocol 86 has (owner decision D-21, docs/MAINNET.md).
# near-sdk-env 0.1.8 / near-sys 0.4 add protocol-88 imports that mainnet refuses at link time.
near-sdk = "=5.29.1"
near-sdk-env = "=0.1.6"
# no_std secp256k1 ECDSA (RFC6979 deterministic nonces, low-s). No `std`/`getrandom`: the
# mock never needs randomness, and the wasm build must not pull an entropy source.
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

# near-sdk >= 5.27 builds contracts with `--cfg near`.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
