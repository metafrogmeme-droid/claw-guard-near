# Cargo workspace for the Claw Guard NEAR contracts, plus the root package
# `claw-guard-tests` that holds the near-workspaces sandbox tests in `tests/`.
# Testnet only. Not audited.
[workspace]
resolver = "2"
members = ["contracts/claw-guard", "contracts/mock-mpc"]
# Plain `cargo build` / `cargo test` at the root keep covering just the contracts, as before the
# root package existed. The sandbox tests run with `cargo test -p claw-guard-tests` (they start
# a local sandbox node); `--workspace` covers everything.
default-members = ["contracts/claw-guard", "contracts/mock-mpc"]

# Release profile for NEAR contract wasm (same settings as the cargo-near 0.22 template):
# small code, no debug info, abort on panic, and overflow checks kept on in release.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package]
name = "claw-guard-tests"
description = "Claw Guard sandbox integration tests (near-workspaces). Sandbox only."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

# `src/lib.rs` is std-only (wasm paths and the contract build step). Everything the tests need
# beyond that is a dev-dependency, so nothing here reaches the contract wasm.
[dependencies]

[dev-dependencies]
near-workspaces = "=0.23.0"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
# Signature recovery (same pin as the contracts) and keccak256 for EVM addresses / tx hashes.
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
sha3 = "=0.11.0"
